name: cropguard-ai
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip=24.0

  # PyTorch (CPU build for portability; swap to pytorch-cuda for GPU)
  - pytorch=2.1.2
  - torchvision=0.16.2
  - torchaudio=2.1.2
  - cpuonly                      # Remove this line and add cudatoolkit=11.8 for GPU

  # Core scientific
  - numpy=1.26.4
  - pandas=2.2.0
  - scipy=1.12.0
  - scikit-learn=1.4.0

  # Visualisation
  - matplotlib=3.8.2
  - seaborn=0.13.2
  - plotly=5.18.0

  # CV
  - opencv=4.9.0
  - pillow=10.2.0

  # Notebook
  - jupyter=1.0.0
  - ipykernel=6.29.0
  - nbformat=5.9.0

  # Utilities
  - tqdm=4.66.2

  - pip:
      - pytorch-grad-cam==1.4.8
      - streamlit==1.31.0
      - optuna==3.5.0
      - thop==0.1.1.post2209072238
      - torchinfo==1.8.0
      - statsmodels==0.14.1
      - python-dotenv==1.0.1
      - watchdog==3.0.0
