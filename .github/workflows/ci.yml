name: CropGuard AI — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (errors only — no style warnings)
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --select=E9,F8,W6 \
            --exclude=__pycache__,.git

  # ── Unit Tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch + dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.1.2 torchvision==0.16.2 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install scikit-learn numpy pandas scipy Pillow \
            opencv-python-headless tqdm matplotlib seaborn \
            pytest pytest-timeout

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --timeout=120 \
            -x
