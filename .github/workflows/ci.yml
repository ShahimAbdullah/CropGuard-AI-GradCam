name: CropGuard AI — CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & format check ─────────────────────────────────────────────────────
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --ignore=E203,W503,E501 \
            --exclude=__pycache__,.git

      - name: Check black formatting
        run: black --check src/ tests/ --line-length=100

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (CPU)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install CPU-only PyTorch + dependencies
        run: |
          pip install --upgrade pip
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt --ignore-requires-python

      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --timeout=120 \
            -x

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/

  # ── Docker build check ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cropguard-ai:ci .

      - name: Smoke test container health
        run: |
          docker run -d --name cropguard_test -p 8501:8501 \
            -e MODEL_CHECKPOINT=/app/checkpoints/best_cropguard_phase4.pt \
            cropguard-ai:ci
          sleep 30
          docker logs cropguard_test
          docker stop cropguard_test
          docker rm cropguard_test
